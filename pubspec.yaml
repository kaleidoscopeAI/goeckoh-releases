name: echo_v4
description: Neuro-Acoustic Mirror (Offline AI)
publish_to: 'none'
version: 4.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # --- Core Audio Stack ---
  record: ^5.1.0
  flutter_tts: ^3.8.5
  speech_to_text: ^7.0.0

  # --- Neural Bindings ---
  # Note: llama_cpp requires native builds (Android/iOS/Desktop only)
  llama_cpp: ^1.2.0

  # --- Utilities ---
  path_provider: ^2.1.2
  permission_handler: ^11.3.0
  dio: ^5.4.1
  crypto: ^3.0.3
  shared_preferences: ^2.2.2
  rxdart: ^0.27.7
  http: ^1.2.0

dependency_overrides:
  record_linux: ^1.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
